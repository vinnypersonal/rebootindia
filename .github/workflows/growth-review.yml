name: Growth Review (daily, T13)

on:
  schedule:
    - cron: "0 18 * * *"  # ~23:30 IST, after the day's posting is done
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: reboot-director
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run Director (growth-review)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        # growth-review only reads engagement + writes weights, it never posts —
        # --dry-run here is just belt-and-suspenders, director.run_growth_review
        # doesn't call any poster.
        run: python -m src.director --mode growth-review --dry-run

      - name: Commit state.db
        run: |
          git config user.name "reboot-india-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.db
          if git diff --cached --quiet; then
            echo "no state.db changes to commit"
            exit 0
          fi
          git commit -m "chore: update state.db [growth-review run]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed state.db on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt), fetching + rebasing onto latest main..."
            git fetch origin main
            git rebase origin/main -X ours || git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo "::warning::could not push state.db after 5 attempts (concurrent run likely) - this run's task/log data won't be reflected in the committed state.db, but the campaign work itself already completed"
